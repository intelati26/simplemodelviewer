# Starts an emulator, drives the app like a person (scripts/ui_smoke.sh) and keeps a screenshot per step as artifacts,
# so a UI change can be eyeballed without a device. The app reads SPC's live data: a server outage fails this job, not the build.
name: android-ui
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['androidApp/**', 'shared/**', 'core/**', 'scripts/ui_smoke.sh', '.github/workflows/android-ui.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: pip install pillow
      - run: ./gradlew :androidApp:assembleDebug
      - name: Emulator + smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/ui_smoke.sh screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
