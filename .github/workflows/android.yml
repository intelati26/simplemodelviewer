name: simplemodelview / android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write   # tag builds attach the APK to a GitHub Release
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      # ANDROID_HOME is set on GitHub's runners, which also enables the :androidApp module in settings.gradle.kts
      - name: Shared tests and debug APK
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: simplemodelview-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - name: Attach the APK to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: androidApp/build/outputs/apk/debug/*.apk
          prerelease: true
