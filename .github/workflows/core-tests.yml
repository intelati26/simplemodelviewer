name: simplemodelview / core-tests
on:
  push:
    paths: ['core/**', 'fixtures/**', '.github/workflows/core-tests.yml']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libblosc-dev zlib1g-dev
      - run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
